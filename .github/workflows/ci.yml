name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint
        run: npx eslint "{src,test}/**/*.ts"
      - run: npm run build
      - name: Unit tests
        run: npm test
      - name: E2E tests (external API mocked)
        run: npm run test:e2e
